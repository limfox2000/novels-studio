name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你在创作流程中遇到了什么不便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 希望它如何工作？如有备选方案也请一并说明。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法或现有替代方式
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      multiple: true
      options:
        - 作品书架 / 封面
        - 节点画布
        - 属性面板
        - 大纲管理器
        - 正文管理器
        - 编辑室 / 编辑部
        - 模型中心
        - 视觉素材（生图 / 视频）
        - 后端 / 部署
        - 其他
  - type: checkboxes
    id: contribution
    attributes:
      label: 是否愿意参与实现
      options:
        - label: 我可以提交 PR
